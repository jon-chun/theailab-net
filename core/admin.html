<section class="hero"><h1>Admin: User Approvals</h1></section></header>

<main class="content-wrapper">
<div class="page-content">

<p id="admin-status">Loading&hellip;</p>
<table id="users-table" style="display:none; width:100%;">
<thead>
<tr><th>Name</th><th>Username</th><th>Status</th><th>Role</th><th>Requested</th><th>Action</th></tr>
</thead>
<tbody id="users-body"></tbody>
</table>

</div>
</main>
<footer class="site-footer">
<p>IPHS 400: Frontiers in AI · Kenyon College</p>
</footer>

<script>
(function () {
  var statusEl = document.getElementById("admin-status");
  var table = document.getElementById("users-table");
  var body = document.getElementById("users-body");

  function decide(username, action, btn) {
    btn.disabled = true;
    fetch("/.netlify/functions/admin-decide", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: username, action: action }),
    })
      .then(function (res) { return res.json().then(function (d) { return { ok: res.ok, d: d }; }); })
      .then(function (r) {
        if (r.ok) { load(); } else { alert(r.d.error || "Action failed."); btn.disabled = false; }
      })
      .catch(function () { alert("Network error."); btn.disabled = false; });
  }

  function render(users) {
    body.innerHTML = "";
    users.forEach(function (u) {
      var tr = document.createElement("tr");

      function cell(text) {
        var td = document.createElement("td");
        td.textContent = text;
        return td;
      }

      tr.appendChild(cell(u.name));
      tr.appendChild(cell(u.username));
      tr.appendChild(cell(u.status));
      tr.appendChild(cell(u.role));
      tr.appendChild(cell(u.createdAt ? new Date(u.createdAt).toLocaleString() : ""));

      var actionTd = document.createElement("td");
      if (u.status === "pending") {
        var approveBtn = document.createElement("button");
        approveBtn.textContent = "Approve";
        approveBtn.addEventListener("click", function () { decide(u.username, "approve", approveBtn); });

        var rejectBtn = document.createElement("button");
        rejectBtn.textContent = "Reject";
        rejectBtn.style.marginLeft = "8px";
        rejectBtn.addEventListener("click", function () { decide(u.username, "reject", rejectBtn); });

        actionTd.appendChild(approveBtn);
        actionTd.appendChild(rejectBtn);
      } else {
        actionTd.textContent = u.decidedAt ? "Decided" : "—";
      }
      tr.appendChild(actionTd);

      body.appendChild(tr);
    });
  }

  function load() {
    fetch("/.netlify/functions/admin-users")
      .then(function (res) { return res.json().then(function (d) { return { ok: res.ok, d: d }; }); })
      .then(function (r) {
        if (!r.ok) {
          statusEl.textContent = r.d.error || "Access denied.";
          return;
        }
        statusEl.style.display = "none";
        table.style.display = "table";
        render(r.d.users);
      })
      .catch(function () {
        statusEl.textContent = "Network error.";
      });
  }

  load();
})();
</script>
<script src="/css/auth-nav.js"></script>
</body>
</html>
