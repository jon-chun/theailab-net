<body>
<header class="site-header no-featured-image">

<section class="hero"><h1>My Account</h1></section></header>

<main class="content-wrapper">
<div class="page-content">

<p id="account-status">Loading&hellip;</p>

<form id="change-password-form" novalidate style="display:none;">
<h2>Change Password</h2>
<p>
<label for="current-password">Current password</label><br/>
<input id="current-password" name="current-password" type="password" autocomplete="current-password" required minlength="8"/>
</p>
<p>
<label for="new-password">New password</label><br/>
<input id="new-password" name="new-password" type="password" autocomplete="new-password" required minlength="8"/>
<br/><small>At least 8 characters.</small>
</p>
<p><button type="submit">Change Password</button></p>
</form>

<p id="change-message" role="status"></p>

</div>
</main>
<footer class="site-footer">
<p>IPHS 400: Frontiers in AI · Kenyon College</p>
</footer>

<script>
(function () {
  var statusEl = document.getElementById("account-status");
  var form = document.getElementById("change-password-form");
  var message = document.getElementById("change-message");

  fetch("/.netlify/functions/session")
    .then(function (res) { return res.json(); })
    .then(function (data) {
      if (!data.authenticated) {
        window.location.href = "/login.html?next=" + encodeURIComponent(window.location.pathname);
        return;
      }
      statusEl.textContent = "Logged in as " + data.username + " (" + data.role + ").";
      form.style.display = "block";
    })
    .catch(function () {
      statusEl.textContent = "Could not check login status.";
    });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    message.textContent = "";
    var currentPassword = document.getElementById("current-password").value;
    var newPassword = document.getElementById("new-password").value;

    fetch("/.netlify/functions/change-password", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ currentPassword: currentPassword, newPassword: newPassword }),
    })
      .then(function (res) {
        return res.json().then(function (data) {
          return { ok: res.ok, data: data };
        });
      })
      .then(function (result) {
        message.textContent = result.data.message || result.data.error || "Something went wrong.";
        if (result.ok) form.reset();
      })
      .catch(function () {
        message.textContent = "Network error. Please try again.";
      });
  });
})();
</script>
<script src="css/auth-nav.js"></script>
</body>
</html>
