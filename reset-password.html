<section class="hero"><h1>Reset Password</h1></section></header>

<main class="content-wrapper">
<div class="page-content">

<p>Choose a new password for your account.</p>

<form id="reset-form" novalidate>
<p>
<label for="new-password">New password</label><br/>
<input id="new-password" name="new-password" type="password" autocomplete="new-password" required minlength="8"/>
<br/><small>At least 8 characters.</small>
</p>
<p><button type="submit">Reset Password</button></p>
</form>

<p id="reset-message" role="status"></p>

<p><a href="login.html">&larr; Back to Log In</a></p>

</div>
</main>
<footer class="site-footer">
<p>IPHS 400: Frontiers in AI · Kenyon College</p>
</footer>

<script>
(function () {
  var form = document.getElementById("reset-form");
  var message = document.getElementById("reset-message");
  var params = new URLSearchParams(window.location.search);
  var username = params.get("username") || "";
  var token = params.get("token") || "";

  if (!username || !token) {
    form.style.display = "none";
    message.textContent = "This reset link is missing required information. Request a new one from the Forgot Password page.";
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    message.textContent = "";
    var newPassword = document.getElementById("new-password").value;

    fetch("/.netlify/functions/reset-password", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: username, token: token, newPassword: newPassword }),
    })
      .then(function (res) {
        return res.json().then(function (data) {
          return { ok: res.ok, data: data };
        });
      })
      .then(function (result) {
        message.textContent = result.data.message || result.data.error || "Something went wrong.";
        if (result.ok) {
          form.style.display = "none";
        }
      })
      .catch(function () {
        message.textContent = "Network error. Please try again.";
      });
  });
})();
</script>
</body>
</html>
